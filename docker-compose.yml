services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Silo is the maintained fork of MinIO, which was archived in April 2026. The service and
  # MINIO_* names are kept so the server and AI worker config do not change.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/minio-init.sh']
    restart: 'no'

  # Both AI containers sit behind the `ai` profile so a plain `docker compose up`
  # does not build torch or start a 4.7 GB language model.
  ollama:
    image: ollama/ollama:latest
    profiles: ['ai']
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama

  ai-service:
    build: ./ai-service
    profiles: ['ai']
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      AI_COMPUTE_PROFILE: ${AI_COMPUTE_PROFILE:-cpu}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-1200}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-2048}
    volumes:
      # The model is downloaded on the first transcription request; keep it out of
      # the image layer so a rebuild does not re-download it.
      - whisper-models:/root/.cache/whisper
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  ai-worker:
    build: ./ai-service
    profiles: ['ai']
    restart: unless-stopped
    depends_on:
      - redis
      - minio
      - ollama
    # Redis and object storage default to the Compose services. The AI_WORKER_* overrides point
    # the worker at managed services; they are separate from REDIS_URL and MINIO_* because those
    # hold the host-facing addresses the Node.js processes use.
    environment:
      REDIS_URL: ${AI_WORKER_REDIS_URL:-redis://redis:6379}
      AI_TRANSCRIPTION_STREAM: ${AI_TRANSCRIPTION_STREAM:-ai.transcription.jobs}
      AI_ANALYSIS_STREAM: ${AI_ANALYSIS_STREAM:-ai.analysis.jobs}
      AI_RESULT_STREAM: ${AI_RESULT_STREAM:-ai.results}
      AI_STREAM_MAXLEN: ${AI_STREAM_MAXLEN:-10000}
      AI_STREAM_READ_BLOCK_MS: ${AI_STREAM_READ_BLOCK_MS:-1000}
      AI_STREAM_CLAIM_IDLE_MS: ${AI_STREAM_CLAIM_IDLE_MS:-60000}
      AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-whisper}
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-llm}
      AI_TRANSCRIPTION_LANGUAGE: ${AI_TRANSCRIPTION_LANGUAGE:-en}
      AI_ANALYSIS_LANGUAGE: ${AI_ANALYSIS_LANGUAGE:-en}
      AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-3}
      AI_JOB_RETRY_DELAY_SECONDS: ${AI_JOB_RETRY_DELAY_SECONDS:-5}
      AI_JOB_LOCK_TTL_SECONDS: ${AI_JOB_LOCK_TTL_SECONDS:-3600}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      AI_COMPUTE_PROFILE: ${AI_COMPUTE_PROFILE:-cpu}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-1200}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-2048}
      MINIO_ENDPOINT: ${AI_WORKER_MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${AI_WORKER_MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${AI_WORKER_MINIO_USE_SSL:-false}
      MINIO_BUCKET_AI_RESULTS: ${MINIO_BUCKET_AI_RESULTS:-meeting-ai-results}
    volumes:
      - whisper-models:/root/.cache/whisper
    command: ['python', '-m', 'app.worker']

volumes:
  postgres-data:
  redis-data:
  minio-data:
  whisper-models:
  ollama-data:
