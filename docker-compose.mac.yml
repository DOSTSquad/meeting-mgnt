# Optional overlay for macOS development. Docker on macOS cannot reach the Apple GPU, so Ollama runs
# natively on the Mac (it uses Metal) and the AI containers call it through host.docker.internal.
# Whisper stays on CPU in the ai-worker container. Enable with COMPOSE_FILE in .env (see .env.example).
services:
  # Kept out of the `ai` profile so it does not take port 11434 from the native Ollama. Without a
  # native Ollama, enable the `ollama-container` profile: the published 127.0.0.1:11434 is what
  # host.docker.internal:11434 reaches, so the AI containers need no other change.
  ollama:
    profiles: !override ['ollama-container']

  ai-service:
    depends_on: !reset []
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  ai-worker:
    depends_on: !override [redis, minio]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
