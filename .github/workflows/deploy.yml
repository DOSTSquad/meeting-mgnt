name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build client bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    # No deployment secrets are declared here on purpose. This job runs `npm ci`,
    # which executes third-party install scripts, so it must not have access to
    # DEPLOY_SSH_KEY.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build client
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          VITE_API_BASE_URL=/ npm run build --workspace=client

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/meeting-mgnt' }}
      SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'meeting-mgnt-server.service' }}
      WORKER_SERVICE_NAME: ${{ vars.DEPLOY_WORKER_SERVICE_NAME || 'meeting-mgnt-worker.service' }}
      AI_WORKER_SERVICE_NAME: ${{ vars.DEPLOY_AI_WORKER_SERVICE_NAME || 'meeting-mgnt-ai-worker.service' }}

    steps:
      - name: Check deployment configuration
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync code and install runtime dependencies
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v node >/dev/null || { echo "node not found. Install Node.js globally or make it available on PATH."; exit 1; }
          command -v npm >/dev/null || { echo "npm not found. Install Node.js globally or make it available on PATH."; exit 1; }
          command -v rsync >/dev/null || { echo "rsync not found. Install rsync on the VPS."; exit 1; }
          node -v
          npm -v

          cd "${APP_DIR}"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          npm ci --omit=dev --no-audit --no-fund

          # The venv is created by hand on the host (see ai-service/README.md); keep it in
          # step with requirements so a restart does not fail on a missing import.
          if [ -x ai-service/.venv/bin/pip ]; then
            ai-service/.venv/bin/pip install --quiet --no-cache-dir -r ai-service/requirements.fixture.txt
          fi
          REMOTE

      - name: Upload client bundle
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8" \
            client/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/client/dist/"

      - name: Migrate and restart
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${DEPLOY_PATH}' SERVICE_NAME='${SERVICE_NAME}' WORKER_SERVICE_NAME='${WORKER_SERVICE_NAME}' AI_WORKER_SERVICE_NAME='${AI_WORKER_SERVICE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail

          # Restarts an optional unit only when it is installed, so the deploy stays green
          # until the unit is set up. Only a failed unit is a deployment failure.
          restart_if_installed() {
            local label="$1" unit="$2"

            if ! systemctl list-unit-files --no-legend "${unit}" | grep -q .; then
              echo "${label} unit ${unit} is not installed; skipping restart."
              return 0
            fi

            sudo systemctl restart "${unit}"

            if systemctl is-failed --quiet "${unit}"; then
              echo "${label} unit ${unit} failed to start."
              sudo systemctl status "${unit}" --no-pager
              exit 1
            fi

            echo "${label} unit ${unit} is $(systemctl is-active "${unit}" || true)."
          }

          cd "${APP_DIR}"
          npm run migrate --workspace=server

          sudo systemctl restart "${SERVICE_NAME}"

          # The worker exits 0 when AI_PIPELINE_ENABLED is not true, so systemd reports it
          # inactive rather than failed.
          restart_if_installed "Worker" "${WORKER_SERVICE_NAME}"
          restart_if_installed "AI worker" "${AI_WORKER_SERVICE_NAME}"

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health/live; then
              exit 0
            fi

            echo "Waiting for API health check (${attempt}/20)..."
            sleep 2
          done

          sudo systemctl status "${SERVICE_NAME}" --no-pager
          exit 1
          REMOTE
