name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build client
        run: VITE_API_BASE_URL=/ npm run build --workspace=client

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/meeting-mgnt' }}
      SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'meeting-mgnt-server.service' }}

    steps:
      - name: Check deployment configuration
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${DEPLOY_PATH}' SERVICE_NAME='${SERVICE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v node >/dev/null || { echo "node not found. Install Node.js globally or make it available on PATH."; exit 1; }
          command -v npm >/dev/null || { echo "npm not found. Install Node.js globally or make it available on PATH."; exit 1; }
          node -v
          npm -v

          cd "${APP_DIR}"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          npm ci
          VITE_API_BASE_URL=/ npm run build --workspace=client
          npm run migrate --workspace=server

          sudo systemctl restart "${SERVICE_NAME}"

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health/live; then
              exit 0
            fi

            echo "Waiting for API health check (${attempt}/20)..."
            sleep 2
          done

          sudo systemctl status "${SERVICE_NAME}" --no-pager
          exit 1
          REMOTE
