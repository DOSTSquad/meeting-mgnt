name: Deploy Swarm

on:
  workflow_dispatch:
    inputs:
      stack_file:
        description: Swarm stack file to deploy
        required: true
        default: stack.yml
        type: choice
        options:
          - stack.yml
          - pilot-stack.yml
      image_tag:
        description: Container image tag. Defaults to the commit SHA when omitted.
        required: false
        type: string

concurrency:
  group: swarm-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest

    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image names
        id: images
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${{ inputs.image_tag }}"

          if [ -z "${image_tag}" ]; then
            image_tag="${GITHUB_SHA}"
          fi

          echo "api_image=${image_namespace}/meeting-mgnt-api:${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "web_image=${image_namespace}/meeting-mgnt-web:${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/swarm/Dockerfile.api
          push: true
          tags: ${{ steps.images.outputs.api_image }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/swarm/Dockerfile.web
          push: true
          build-args: |
            VITE_API_BASE_URL=/
          tags: ${{ steps.images.outputs.web_image }}

  deploy:
    name: Deploy stack to Swarm
    runs-on: ubuntu-latest
    needs: build
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.SWARM_DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.SWARM_DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.SWARM_DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.SWARM_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ vars.SWARM_DEPLOY_PATH || vars.DEPLOY_PATH || '/srv/meeting-mgnt' }}
      STACK_NAME: ${{ vars.SWARM_STACK_NAME || 'meeting-mgnt' }}
      STACK_FILE: ${{ inputs.stack_file }}
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}
      REGISTRY_USER: ${{ vars.SWARM_REGISTRY_USER || github.actor }}
      REGISTRY_TOKEN: ${{ secrets.SWARM_REGISTRY_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing SWARM_DEPLOY_HOST or DEPLOY_HOST secret"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing SWARM_DEPLOY_USER or DEPLOY_USER secret"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing SWARM_DEPLOY_SSH_KEY or DEPLOY_SSH_KEY secret"; exit 1; }
          test -n "${REGISTRY_TOKEN}" || { echo "Missing registry token"; exit 1; }

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Package Swarm deployment files
        run: |
          set -euo pipefail
          tar -czf swarm-bundle.tgz deploy/swarm scripts/postgres-init.sql

      - name: Upload Swarm deployment files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" swarm-bundle.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/swarm-bundle.tgz"

      - name: Deploy Swarm stack
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' STACK_NAME='${STACK_NAME}' STACK_FILE='${STACK_FILE}' API_IMAGE='${API_IMAGE}' WEB_IMAGE='${WEB_IMAGE}' REGISTRY_USER='${REGISTRY_USER}' REGISTRY_TOKEN='${REGISTRY_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v docker >/dev/null || { echo "docker not found"; exit 1; }

          mkdir -p "${DEPLOY_PATH}"
          cd "${DEPLOY_PATH}"
          tar -xzf swarm-bundle.tgz

          if ! docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active; then
            echo "Docker Swarm is not active on this host. Run docker swarm init first."
            exit 1
          fi

          if [ ! -f deploy/swarm/swarm.env ]; then
            cp deploy/swarm/swarm.env.example deploy/swarm/swarm.env
            echo "Created deploy/swarm/swarm.env from the example. Populate production values and rerun."
            exit 1
          fi

          set -a
          . deploy/swarm/swarm.env
          set +a

          export API_IMAGE WEB_IMAGE

          printf '%s\n' "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

          docker stack deploy \
            --with-registry-auth \
            -c "deploy/swarm/${STACK_FILE}" \
            "${STACK_NAME}"

          docker run --rm \
            --network "${STACK_NAME}_backend" \
            --env-file deploy/swarm/swarm.env \
            "${API_IMAGE}" \
            npm run migrate --workspace=server

          docker stack services "${STACK_NAME}"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health/live; then
              exit 0
            fi

            echo "Waiting for Swarm public health check (${attempt}/30)..."
            sleep 2
          done

          docker service logs "${STACK_NAME}_api" --tail 100 || true
          exit 1
          REMOTE
