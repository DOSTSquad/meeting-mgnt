services:
  caddy:
    image: ${WEB_IMAGE:-meeting-mgnt-web:latest}
    environment:
      APP_SITE: ${APP_SITE:-http://:80}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    networks:
      - frontend
      - backend
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      replicas: ${CADDY_REPLICAS:-1}
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${API_IMAGE:-meeting-mgnt-api:latest}
    environment:
      NODE_ENV: production
      PORT: 3001
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-300000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_FILES: ${MINIO_BUCKET_FILES:-meeting-files}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-meeting-audio}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: ${API_REPLICAS:-2}
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1

networks:
  frontend:
    driver: overlay
    attachable: true
  backend:
    driver: overlay
    attachable: true

volumes:
  caddy-data:
  caddy-config:
